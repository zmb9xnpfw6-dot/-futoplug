<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>FUTOPlug — Student Marketplace</title>
<meta name="application-version" content="2026-09-26-final">
<style>
:root{--p:#0f766e;--p2:#115e59;--bg:#f6f8f8;--card:#fff;--text:#10201f;--muted:#667675;--line:#e3e9e8;--danger:#b42318;--ok:#067647}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:82px}header{background:var(--p);color:#fff;padding:20px 18px 18px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}.brand{font-weight:900;font-size:28px}.tag{font-size:13px;opacity:.9;margin-top:3px}.search{margin-top:14px;background:#fff;border:0;border-radius:14px;padding:13px 14px;width:100%;color:#222;outline:0}main{padding:16px}.section{margin:18px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:18px;font-weight:800}.small{font-size:12px;color:var(--muted)}.cats{display:flex;gap:9px;overflow:auto;padding:3px 0 5px}.cat{flex:0 0 auto;background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:14px;font-size:12px}.cat.active{background:#e8f3f1;color:var(--p2);font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:0 2px 8px #00000008}.pic{height:120px;border-radius:13px;background:linear-gradient(135deg,#d9f3ef,#eef6f5);display:flex;align-items:center;justify-content:center;font-size:42px}.name{font-weight:750;margin-top:9px;font-size:14px}.price{font-weight:900;color:var(--p);margin-top:4px}.seller{font-size:11px;color:var(--muted);margin-top:4px}.btn{background:var(--p);color:white;padding:11px 13px;border-radius:12px;font-weight:750}.btn.alt{background:#e8f3f1;color:var(--p2)}.btn.full{width:100%;margin-top:10px}.btn.danger{background:#feeceb;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8f3f1;color:var(--p2);font-size:11px;font-weight:700}.pill.ok{background:#ecfdf3;color:var(--ok)}.pill.warn{background:#fff7ed;color:#b54708}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:70px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:10}nav button{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}nav button.active{color:var(--p);font-weight:800}.ico{font-size:20px}.modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:90vh;overflow:auto}.close{float:right;background:#eef2f1;border-radius:50%;width:36px;height:36px;font-size:22px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:0;background:#fff}.empty{text-align:center;padding:40px 15px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#10201f;color:#fff;padding:11px 15px;border-radius:12px;z-index:30;display:none;font-size:13px;max-width:90%;text-align:center}.toast.show{display:block}.banner{background:#dff5f1;border-radius:18px;padding:17px}.banner h2{margin:0 0 5px}.banner p{margin:0;color:#315654;font-size:13px}.list{display:flex;flex-direction:column;gap:10px}.order{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.admin{background:#10201f;color:#fff;border-radius:18px;padding:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.stat{background:#ffffff12;padding:12px;border-radius:12px}.stat b{font-size:22px;display:block}.notice{padding:11px 13px;border-radius:12px;background:#fff7ed;color:#8a4b08;font-size:12px}.success{padding:11px 13px;border-radius:12px;background:#ecfdf3;color:#05603a;font-size:12px}.hr{height:1px;background:var(--line);margin:16px 0}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ffffff66;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:700px){body{padding:20px}.app{border-radius:25px;overflow:hidden;box-shadow:0 8px 35px #0002}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header><div class="brand">FUTOPlug ⚡</div><div class="tag">Buy. Sell. Connect. — around FUTO & Eziobodo</div><input id="search" class="search" placeholder="Search food, phones, fashion, essentials..." oninput="renderHome()"></header>
<main id="main"></main>
<nav>
<button onclick="go('home')" id="n-home"><span class="ico">⌂</span>Home</button>
<button onclick="go('categories')" id="n-categories"><span class="ico">▦</span>Categories</button>
<button onclick="go('orders')" id="n-orders"><span class="ico">▤</span>Orders</button>
<button onclick="go('cart')" id="n-cart"><span class="ico">🛒</span>Cart <span id="cartCount"></span></button>
<button onclick="go('profile')" id="n-profile"><span class="ico">●</span>Profile</button>
</nav></div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><div id="toast" class="toast"></div>
<script>
/* FUTOPlug production-ready MVP
   Supabase URL + publishable key are intentionally browser-safe keys.
   NEVER use an sb_secret_ or service_role key here.
*/
const SUPABASE_URL='https://czbjuqcvogdwpwqtkteh.supabase.co';
const SUPABASE_KEY='sb_publishable_9bD_0cs52A_SkLlhGeljsw_XqLl7cEF';
const supabaseClient=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const seed=[
{id:1,name:'Indomie & Egg',price:1800,cat:'Food & Drinks',seller:'FUTO Bites',emoji:'🍜',loc:'Eziobodo'},
{id:2,name:'USB-C Fast Charger',price:6500,cat:'Phones & Accessories',seller:'Campus Tech Hub',emoji:'🔌',loc:'Eziobodo'},
{id:3,name:'Phone Case',price:3500,cat:'Phones & Accessories',seller:'Campus Tech Hub',emoji:'📱',loc:'Eziobodo'},
{id:4,name:'Body Spray',price:4500,cat:'Beauty & Personal Care',seller:'Eziobodo Fashion',emoji:'🧴',loc:'Eziobodo'},
{id:5,name:'Laundry Service',price:1500,cat:'Services',seller:'FreshWash',emoji:'🧺',loc:'Eziobodo'},
{id:6,name:'Notebook',price:1200,cat:'School Supplies',seller:'Student Essentials',emoji:'📓',loc:'FUTO'},
{id:7,name:'Extension Box',price:5500,cat:'Room/Hostel Essentials',seller:'Student Essentials',emoji:'🔋',loc:'FUTO'},
{id:8,name:'Sneakers',price:18000,cat:'Fashion',seller:'Eziobodo Fashion',emoji:'👟',loc:'Eziobodo'}];
const cats=['All','Food & Drinks','Fashion','Phones & Accessories','Beauty & Personal Care','Groceries','Electronics','Room/Hostel Essentials','Services','School Supplies'];
let products=seed.slice(),cart=JSON.parse(localStorage.getItem('fp_cart')||'[]'),orders=JSON.parse(localStorage.getItem('fp_orders')||'[]'),page='home',selectedCat='All',session=null,dbProducts=false,loading=false;
const naira=n=>`₦${Number(n||0).toLocaleString('en-NG')}`;
function save(){localStorage.setItem('fp_cart',JSON.stringify(cart));localStorage.setItem('fp_orders',JSON.stringify(orders))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2600)}
function go(p){page=p;document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('n-'+p)?.classList.add('active');render()}
function render(){if(page==='home')renderHome();else if(page==='categories')renderCategories(selectedCat);else if(page==='cart')renderCart();else if(page==='orders')renderOrders();else renderProfile();updateCart()}
function updateCart(){document.getElementById('cartCount').textContent=cart.length?`(${cart.reduce((a,x)=>a+x.qty,0)})`:''}
function card(p){return `<div class="card"><div class="pic">${p.emoji||'🛍️'}</div><div class="name">${esc(p.name)}</div><div class="price">${naira(p.price)}</div><div class="seller">${esc(p.seller||'FUTOPlug seller')} • ${esc(p.loc||'FUTO')}</div><button class="btn full" onclick="add('${String(p.id)}')">Add to cart</button><button class="btn alt full" onclick="detail('${String(p.id)}')">View</button></div>`}
function renderHome(){const q=(document.getElementById('search').value||'').toLowerCase();const list=products.filter(p=>(`${p.name} ${p.seller} ${p.cat} ${p.loc}`).toLowerCase().includes(q));document.getElementById('main').innerHTML=`<div class="banner"><h2>Your campus plug 🛍️</h2><p>Find products and services from sellers around FUTO and Eziobodo.</p>${session?'<button class="btn full" onclick="openAddProduct()">➕ List a product</button>':'<button class="btn full" onclick="openAuth()">Sign in to sell</button>'}</div><div class="section"><div class="row"><div class="title">Categories</div><span class="small">${dbProducts?'Live marketplace':'Demo marketplace'}</span></div><div class="cats">${cats.slice(1,7).map(c=>`<button class="cat" onclick="filterCat('${escAttr(c)}')">${esc(c)}</button>`).join('')}</div></div><div class="section"><div class="row"><div class="title">Popular near you</div><span class="small">${list.length} items</span></div>${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">No matching products yet.</div>'}</div>`}
function filterCat(c){selectedCat=c;go('categories')}
function renderCategories(sel='All'){selectedCat=sel;const list=sel==='All'?products:products.filter(p=>p.cat===sel);document.getElementById('main').innerHTML=`<div class="row"><div class="title">Shop by category</div></div><div class="cats" style="flex-wrap:wrap">${cats.map(c=>`<button class="cat ${c===sel?'active':''}" onclick="filterCat('${escAttr(c)}')">${esc(c)}</button>`).join('')}</div><div class="section">${list.length?`<div class="grid">${list.map(card).join('')}</div>`:'<div class="empty">No products in this category yet.</div>'}</div>`}
function findProduct(id){return products.find(p=>String(p.id)===String(id))}
function add(id){const p=findProduct(id);if(!p)return;const x=cart.find(c=>String(c.id)===String(id));if(x)x.qty++;else cart.push({id:p.id,qty:1});save();updateCart();toast(`${p.name} added to cart`)}
function detail(id){const p=findProduct(id);if(!p)return;open(`<button class="close" onclick="closeM()">×</button><div class="pic">${p.emoji||'🛍️'}</div><h2>${esc(p.name)}</h2><div class="price">${naira(p.price)}</div><p class="small">${esc(p.cat)} • ${esc(p.seller||'FUTOPlug seller')} • ${esc(p.loc||'FUTO')}</p><p>${esc(p.description||'Available from a local FUTOPlug seller.')}</p><button class="btn full" onclick="add('${String(p.id)}');closeM()">Add to cart</button>`)}
function renderCart(){if(!cart.length){document.getElementById('main').innerHTML='<div class="empty"><div style="font-size:48px">🛒</div><h2>Your cart is empty</h2><p>Add something from the marketplace.</p><button class="btn" onclick="go(\'home\')">Shop now</button></div>';return}let items=cart.map(x=>({...findProduct(x.id),qty:x.qty})).filter(Boolean);let total=items.reduce((a,x)=>a+x.price*x.qty,0);document.getElementById('main').innerHTML=`<div class="row"><div class="title">Your cart</div><span class="pill">${items.reduce((a,x)=>a+x.qty,0)} item(s)</span></div><div class="list section">${items.map(x=>`<div class="order"><div class="row"><b>${x.emoji||'🛍️'} ${esc(x.name)}</b><b>${naira(x.price*x.qty)}</b></div><div class="small">${esc(x.seller||'Seller')} • Qty ${x.qty}</div><div style="display:flex;gap:8px;margin-top:9px"><button class="btn alt" onclick="qty('${String(x.id)}',-1)">−</button><button class="btn alt" onclick="qty('${String(x.id)}',1)">+</button><button class="btn danger" onclick="removeCart('${String(x.id)}')">Remove</button></div></div>`).join('')}</div><div class="card"><div class="row"><b>Total</b><b class="price">${naira(total)}</b></div><button class="btn full" onclick="checkout()">Checkout</button></div>`}
function qty(id,d){const x=cart.find(c=>String(c.id)===String(id));if(!x)return;x.qty+=d;if(x.qty<1)cart=cart.filter(c=>String(c.id)!==String(id));save();renderCart();updateCart()}
function removeCart(id){cart=cart.filter(c=>String(c.id)!==String(id));save();renderCart();updateCart()}
function checkout(){if(!session){openAuth('Please sign in before placing an order.');return}open(`<button class="close" onclick="closeM()">×</button><h2>Checkout</h2><div class="success">Signed in as ${esc(session.user.email||'buyer')}</div><div class="field"><label>Phone</label><input id="cphone" placeholder="080..."></div><div class="field"><label>Delivery / Pickup</label><select id="cmode"><option value="pickup">Pickup</option><option value="delivery">Delivery</option></select></div><div class="field"><label>Location / Address</label><input id="caddr" placeholder="Eziobodo lodge / pickup point"></div><div class="field"><label>Payment</label><select id="cpay"><option>Pay on delivery / pickup</option><option>Online payment (coming soon)</option></select></div><button id="placeBtn" class="btn full" onclick="placeOrder()">Place order</button>`)}
async function placeOrder(){const phone=document.getElementById('cphone').value.trim(),addr=document.getElementById('caddr').value.trim(),mode=document.getElementById('cmode').value;if(!phone||!addr){toast('Please fill in your details');return}const items=cart.map(x=>({p:findProduct(x.id),qty:x.qty})).filter(x=>x.p);const total=items.reduce((a,x)=>a+x.p.price*x.qty,0);const btn=document.getElementById('placeBtn');btn.disabled=true;btn.innerHTML='<span class="spinner"></span> Placing...';try{if(dbProducts){const {data:o,error:e}=await supabaseClient.from('orders').insert({buyer_id:session.user.id,total_amount:total,status:'pending',delivery_method:mode,delivery_address:addr,phone}).select().single();if(e)throw e;const rows=items.map(x=>({order_id:o.id,product_id:x.p.id,quantity:x.qty,unit_price:x.p.price}));const {error:ie}=await supabaseClient.from('order_items').insert(rows);if(ie)throw ie;orders.unshift({id:o.id,date:new Date().toLocaleString(),total,status:'Pending',addr,items:items.map(x=>({name:x.p.name,qty:x.qty})),remote:true})}else{orders.unshift({id:'FP'+Date.now().toString().slice(-7),date:new Date().toLocaleString(),total,status:'Pending',addr,items:items.map(x=>({name:x.p.name,qty:x.qty}))})}cart=[];save();closeM();toast('Order placed successfully!');go('orders')}catch(e){console.error(e);toast('Order could not be saved. Check database permissions.')}finally{if(btn){btn.disabled=false;btn.textContent='Place order'}}}
function renderOrders(){document.getElementById('main').innerHTML=`<div class="title">My orders</div>${!session?'<div class="notice section">Sign in to see orders saved to your account.</div>':''}<div class="list section">${orders.length?orders.map(o=>`<div class="order"><div class="row"><b>#${esc(String(o.id).slice(-12))}</b><span class="pill">${esc(o.status)}</span></div><div class="small">${esc(o.date||'')}</div><p>${(o.items||[]).map(i=>`${esc(i.name)} ×${i.qty}`).join(', ')}</p><div class="price">${naira(o.total)}</div><div class="small">📍 ${esc(o.addr||'')}</div></div>`).join(''):'<div class="empty">No orders yet.</div>'}</div>`}
function renderProfile(){document.getElementById('main').innerHTML=`<div class="admin"><div style="font-size:22px;font-weight:900">FUTOPlug</div><p>Student marketplace</p><div class="stats"><div class="stat"><b>${products.length}</b>Products</div><div class="stat"><b>${orders.length}</b>Orders</div><div class="stat"><b>${session?'Signed in':'Guest'}</b>Account</div><div class="stat"><b>${dbProducts?'Live':'Demo'}</b>Data</div></div></div><div class="section list">${session?`<button class="btn alt full" onclick="openAccount()">👤 My account</button><button class="btn danger full" onclick="signOut()">Sign out</button>`:`<button class="btn full" onclick="openAuth()">🔐 Sign in / Create account</button>`}<button class="btn alt full" onclick="openSeller()">🏪 Become a seller</button><button class="btn alt full" onclick="openAdmin()">⚙️ Admin dashboard</button><button class="btn alt full" onclick="testSupabase()">🔌 Test Supabase connection</button></div><div class="card"><b>Marketplace status</b><p class="small">${dbProducts?'Products are being loaded from your Supabase database.':'Using demo products until database products are available.'}</p><p class="small"><b>Security:</b> only a publishable Supabase key is used in this public website.</p></div>`}
async function openAuth(message=''){open(`<button class="close" onclick="closeM()">×</button><h2>${message?'Sign in required':'Welcome to FUTOPlug'}</h2>${message?`<div class="notice">${esc(message)}</div>`:''}<div class="field"><label>Email</label><input id="aemail" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="apass" type="password" placeholder="At least 6 characters"></div><button id="loginBtn" class="btn full" onclick="signIn()">Sign in</button><button class="btn alt full" onclick="signUp()">Create account</button><p class="small">Use the email address you want connected to your FUTOPlug account.</p>`)}
async function signIn(){const email=document.getElementById('aemail').value.trim(),password=document.getElementById('apass').value;if(!email||!password){toast('Enter your email and password');return}const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){toast(error.message);return}closeM();await refreshSession();toast('Signed in successfully')}
async function signUp(){const email=document.getElementById('aemail').value.trim(),password=document.getElementById('apass').value;if(!email||password.length<6){toast('Use a valid email and a 6+ character password');return}const {data,error}=await supabaseClient.auth.signUp({email,password});if(error){toast(error.message);return}if(data.session){closeM();await refreshSession();toast('Account created')}else toast('Account created. Check your email to confirm it, then sign in.')}
async function signOut(){await supabaseClient.auth.signOut();session=null;toast('Signed out');go('profile')}
function openAccount(){open(`<button class="close" onclick="closeM()">×</button><h2>My account</h2><div class="success">${esc(session.user.email||'')}</div><p class="small">Your marketplace account is connected to Supabase.</p>`)}
async function openSeller(){if(!session){openAuth('Sign in before applying as a seller.');return}open(`<button class="close" onclick="closeM()">×</button><h2>Become a Seller</h2><p class="small">Your application will be stored in Supabase for admin review.</p><div class="field"><label>Store name</label><input id="sname" placeholder="e.g. Evans Tech"></div><div class="field"><label>Phone</label><input id="sphone" placeholder="080..."></div><div class="field"><label>Location</label><input id="sloc" value="Eziobodo"></div><button class="btn full" onclick="submitSeller()">Submit for approval</button>`)}
async function submitSeller(){const store_name=document.getElementById('sname').value.trim(),phone=document.getElementById('sphone').value.trim(),location=document.getElementById('sloc').value.trim();if(!store_name||!phone||!location){toast('Fill in all seller details');return}const {error}=await supabaseClient.from('sellers').insert({owner_id:session.user.id,store_name,phone,location,status:'pending'});if(error){console.error(error);toast('Seller application could not be saved. Check seller table permissions.');return}closeM();toast('Seller application sent for admin review')}
function openAddProduct(){if(!session){openAuth('Sign in before listing a product.');return}open(`<button class="close" onclick="closeM()">×</button><h2>List a product</h2><div class="notice">You must have an approved seller profile before the product can be published.</div><div class="field"><label>Product name</label><input id="pname" placeholder="e.g. Phone charger"></div><div class="field"><label>Price (₦)</label><input id="pprice" type="number" placeholder="5000"></div><div class="field"><label>Category</label><select id="pcat">${cats.slice(1).map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="field"><label>Location</label><input id="ploc" value="Eziobodo"></div><div class="field"><label>Description</label><textarea id="pdesc" rows="3" placeholder="Describe the product"></textarea></div><button class="btn full" onclick="submitProduct()">Publish product</button>`)}
async function submitProduct(){const name=document.getElementById('pname').value.trim(),price=Number(document.getElementById('pprice').value),category=document.getElementById('pcat').value,location=document.getElementById('ploc').value.trim(),description=document.getElementById('pdesc').value.trim();if(!name||!price||!location){toast('Fill in the required fields');return}const {data:sellers,error:se}=await supabaseClient.from('sellers').select('*').eq('owner_id',session.user.id);if(se||!sellers?.length){toast('Apply as a seller first');return}const seller=sellers.find(s=>String(s.status||'').toLowerCase()==='approved')||sellers[0];if(String(seller.status||'').toLowerCase()!=='approved'){toast('Your seller account is still awaiting approval');return}const {error}=await supabaseClient.from('products').insert({seller_id:seller.id,name,description,price,category,location,is_active:true});if(error){console.error(error);toast('Product could not be published. Check product table permissions.');return}closeM();await loadProducts();toast('Product published')}
async function testSupabase(){const {error}=await supabaseClient.from('products').select('id').limit(1);toast(error?`Connected, but database access failed: ${error.message}`:'Supabase connection works!')}
async function openAdmin(){const {count,error}=await supabaseClient.from('products').select('id',{count:'exact',head:true});open(`<button class="close" onclick="closeM()">×</button><h2>Admin dashboard</h2><div class="stats"><div class="stat" style="background:#eef7f5;color:#10201f"><b>${error?'—':count||0}</b>Products</div><div class="stat" style="background:#eef7f5;color:#10201f"><b>${orders.length}</b>Orders</div><div class="stat" style="background:#eef7f5;color:#10201f"><b>5%</b>Commission</div><div class="stat" style="background:#eef7f5;color:#10201f"><b>${session?'Live':'Guest'}</b>Session</div></div><p class="small">This page is a dashboard shell. Real admin-only controls should be protected by an admin role and RLS before launch.</p>`)}
async function loadProducts(){loading=true;try{const {data,error}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});if(error)throw error;const {data:sellers}=await supabaseClient.from('sellers').select('*');const sm=new Map((sellers||[]).map(s=>[String(s.id),s]));products=(data||[]).filter(p=>p.is_active!==false).map(p=>{const s=sm.get(String(p.seller_id));return{id:p.id,name:p.name,price:Number(p.price),cat:p.category||p.cat||'Other',seller:s?.store_name||'FUTOPlug seller',emoji:p.emoji||'🛍️',loc:p.location||s?.location||'FUTO',description:p.description||'',db:true}});dbProducts=products.length>0;if(!products.length)products=seed;render()}catch(e){console.warn('Using demo products:',e);products=seed;dbProducts=false;render()}finally{loading=false}}
async function refreshSession(){const {data}=await supabaseClient.auth.getSession();session=data.session||null;render()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function escAttr(v){return esc(v).replace(/`/g,'&#96;')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});function closeM(){document.getElementById('modal').classList.remove('open')}
(async function init(){render();if(!supabaseClient){return}try{await refreshSession();await loadProducts()}catch(e){console.warn('Supabase startup fallback:',e);products=seed;dbProducts=false;render()}})();
</script>
</body></html>
