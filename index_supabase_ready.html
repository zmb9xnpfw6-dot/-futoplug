<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>FUTOPlug — Student Marketplace</title>
<style>
:root{--p:#0f766e;--p2:#115e59;--bg:#f6f8f8;--card:#fff;--text:#10201f;--muted:#667675;--line:#e3e9e8;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:80px}
header{background:var(--p);color:#fff;padding:20px 18px 18px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}
.brand{font-weight:900;font-size:25px}.tag{font-size:12px;opacity:.85;margin-top:2px}.search{margin-top:14px;background:#fff;border:0;border-radius:14px;padding:12px 14px;width:100%;color:#222;outline:0}
main{padding:16px}.section{margin:18px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:18px;font-weight:800}.small{font-size:12px;color:var(--muted)}
.cats{display:flex;gap:9px;overflow:auto;padding:3px 0 5px}.cat{flex:0 0 auto;background:#fff;border:1px solid var(--line);padding:10px 12px;border-radius:14px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:0 2px 8px #00000008}.pic{height:120px;border-radius:13px;background:linear-gradient(135deg,#d9f3ef,#eef6f5);display:flex;align-items:center;justify-content:center;font-size:42px}.name{font-weight:750;margin-top:9px;font-size:14px}.price{font-weight:900;color:var(--p);margin-top:4px}.seller{font-size:11px;color:var(--muted);margin-top:4px}.btn{background:var(--p);color:white;padding:11px 13px;border-radius:12px;font-weight:750}.btn.alt{background:#e8f3f1;color:var(--p2)}.btn.full{width:100%;margin-top:10px}.btn.danger{background:#feeceb;color:var(--danger)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e8f3f1;color:var(--p2);font-size:11px;font-weight:700}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:68px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:10}nav button{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}nav button.active{color:var(--p);font-weight:800}.ico{font-size:20px}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:520px;margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:88vh;overflow:auto}.close{float:right;background:#eef2f1;border-radius:50%;width:34px;height:34px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;outline:0;background:#fff}.empty{text-align:center;padding:40px 15px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#10201f;color:#fff;padding:11px 15px;border-radius:12px;z-index:30;display:none;font-size:13px}.toast.show{display:block}
.banner{background:#dff5f1;border-radius:18px;padding:17px}.banner h2{margin:0 0 5px}.banner p{margin:0;color:#315654;font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}.order{background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}
.admin{background:#10201f;color:#fff;border-radius:18px;padding:16px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.stat{background:#ffffff12;padding:12px;border-radius:12px}.stat b{font-size:22px;display:block}
@media(min-width:700px){body{padding:20px}.app{border-radius:25px;overflow:hidden;box-shadow:0 8px 35px #0002}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
<header>
  <div class="brand">FUTOPlug ⚡</div><div class="tag">Buy. Sell. Connect. — around FUTO & Eziobodo</div>
  <input id="search" class="search" placeholder="Search food, phones, fashion, essentials..." oninput="renderHome()">
</header>
<main id="main"></main>
<nav>
 <button onclick="go('home')" id="n-home"><span class="ico">⌂</span>Home</button>
 <button onclick="go('categories')" id="n-categories"><span class="ico">▦</span>Categories</button>
 <button onclick="go('orders')" id="n-orders"><span class="ico">▤</span>Orders</button>
 <button onclick="go('cart')" id="n-cart"><span class="ico">🛒</span>Cart <span id="cartCount"></span></button>
 <button onclick="go('profile')" id="n-profile"><span class="ico">●</span>Profile</button>
</nav>
</div>

<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="toast"></div>

<script>
/* ================= FUTOPlug + Supabase =================
   1) Keep the URL below exactly as shown.
   2) Paste your FULL Supabase Publishable key (sb_publishable_...)
      or legacy anon key (eyJ...) between the quotes below.
   3) Never paste an sb_secret_... or service_role key here.
*/
const SUPABASE_URL = 'https://czbjuqcvogdwpwqtkteh.supabase.co';
const SUPABASE_KEY = 'PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';
const SUPABASE_READY = !SUPABASE_KEY.includes('PASTE_YOUR_SUPABASE');
let supabaseClient = null;
if (SUPABASE_READY && window.supabase) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

const seed=[
{id:1,name:"Indomie & Egg",price:1800,cat:"Food & Drinks",seller:"FUTO Bites",emoji:"🍜",loc:"Eziobodo"},
{id:2,name:"USB-C Fast Charger",price:6500,cat:"Phones & Accessories",seller:"Campus Tech Hub",emoji:"🔌",loc:"Eziobodo"},
{id:3,name:"Phone Case",price:3500,cat:"Phones & Accessories",seller:"Campus Tech Hub",emoji:"📱",loc:"Eziobodo"},
{id:4,name:"Body Spray",price:4500,cat:"Beauty & Personal Care",seller:"Eziobodo Fashion",emoji:"🧴",loc:"Eziobodo"},
{id:5,name:"Laundry Service",price:1500,cat:"Services",seller:"FreshWash",emoji:"🧺",loc:"Eziobodo"},
{id:6,name:"Notebook",price:1200,cat:"School Supplies",seller:"Student Essentials",emoji:"📓",loc:"FUTO"},
{id:7,name:"Extension Box",price:5500,cat:"Room/Hostel Essentials",seller:"Student Essentials",emoji:"🔋",loc:"FUTO"},
{id:8,name:"Sneakers",price:18000,cat:"Fashion",seller:"Eziobodo Fashion",emoji:"👟",loc:"Eziobodo"}
];
let products=JSON.parse(localStorage.getItem("fp_products")||"null")||seed;
let cart=JSON.parse(localStorage.getItem("fp_cart")||"[]");
let orders=JSON.parse(localStorage.getItem("fp_orders")||"[]");
let page="home";

const cats=["All","Food & Drinks","Fashion","Phones & Accessories","Beauty & Personal Care","Groceries","Electronics","Room/Hostel Essentials","Services","School Supplies"];
const naira=n=>`₦${Number(n).toLocaleString("en-NG")}`;
function save(){localStorage.setItem("fp_products",JSON.stringify(products));localStorage.setItem("fp_cart",JSON.stringify(cart));localStorage.setItem("fp_orders",JSON.stringify(orders));}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function go(p){page=p;document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));let n=document.getElementById("n-"+p);if(n)n.classList.add("active");render()}
function render(){if(page==="home")renderHome();else if(page==="categories")renderCategories();else if(page==="cart")renderCart();else if(page==="orders")renderOrders();else renderProfile();updateCart()}
function updateCart(){document.getElementById("cartCount").textContent=cart.length?`(${cart.length})`:""}
function renderHome(){
 const q=(document.getElementById("search").value||"").toLowerCase();
 const list=products.filter(p=>(p.name+p.seller+p.cat).toLowerCase().includes(q));
 document.getElementById("main").innerHTML=`
 <div class="banner"><h2>Your campus plug 🛍️</h2><p>Find products and services from sellers around FUTO and Eziobodo.</p><button class="btn full" onclick="openSeller()">Become a Seller</button></div>
 <div class="section"><div class="row"><div class="title">Categories</div><span class="small">Explore</span></div><div class="cats">${cats.slice(1,7).map(c=>`<button class="cat" onclick="filterCat('${c}')">${c}</button>`).join("")}</div></div>
 <div class="section"><div class="row"><div class="title">Popular near you</div><span class="small">${list.length} items</span></div><div class="grid">${list.map(card).join("")}</div></div>`;
}
function filterCat(c){document.getElementById("search").value="";page="categories";renderCategories(c)}
function card(p){return `<div class="card"><div class="pic">${p.emoji||"🛍️"}</div><div class="name">${p.name}</div><div class="price">${naira(p.price)}</div><div class="seller">${p.seller} • ${p.loc}</div><button class="btn full" onclick="add(${p.id})">Add to cart</button><button class="btn alt full" onclick="detail(${p.id})">View</button></div>`}
function renderCategories(selected="All"){
 const list=selected==="All"?products:products.filter(p=>p.cat===selected);
 document.getElementById("main").innerHTML=`<div class="row"><div class="title">Shop by category</div></div><div class="cats" style="flex-wrap:wrap">${cats.map(c=>`<button class="cat" onclick="renderCategories('${c}')">${c}</button>`).join("")}</div><div class="section"><div class="grid">${list.map(card).join("")}</div></div>`;
}
function add(id){let p=products.find(x=>x.id===id);cart.push({id,qty:1});save();updateCart();toast(`${p.name} added to cart`)}
function detail(id){let p=products.find(x=>x.id===id);open(`<button class="close" onclick="closeM()">×</button><div class="pic">${p.emoji}</div><h2>${p.name}</h2><div class="price">${naira(p.price)}</div><p class="small">${p.cat} • ${p.seller} • ${p.loc}</p><p>Available from a local FUTOPlug seller. Message the seller or add the item to your cart.</p><button class="btn full" onclick="add(${p.id});closeM()">Add to cart</button>`)}
function renderCart(){
 if(!cart.length){document.getElementById("main").innerHTML=`<div class="empty"><div style="font-size:48px">🛒</div><h2>Your cart is empty</h2><p>Add something from the marketplace.</p><button class="btn" onclick="go('home')">Shop now</button></div>`;return}
 let items=cart.map(x=>({...products.find(p=>p.id===x.id),qty:x.qty}));
 let total=items.reduce((a,x)=>a+x.price*x.qty,0);
 document.getElementById("main").innerHTML=`<div class="row"><div class="title">Your cart</div><span class="pill">${items.length} item(s)</span></div><div class="list section">${items.map(x=>`<div class="order"><div class="row"><b>${x.emoji} ${x.name}</b><b>${naira(x.price*x.qty)}</b></div><div class="small">${x.seller} • Qty ${x.qty}</div><div style="display:flex;gap:8px;margin-top:9px"><button class="btn alt" onclick="qty(${x.id},-1)">−</button><button class="btn alt" onclick="qty(${x.id},1)">+</button><button class="btn danger" onclick="removeCart(${x.id})">Remove</button></div></div>`).join("")}</div><div class="card"><div class="row"><b>Total</b><b class="price">${naira(total)}</b></div><button class="btn full" onclick="checkout()">Checkout</button></div>`;
}
function qty(id,d){let x=cart.find(c=>c.id===id);x.qty+=d;if(x.qty<1)cart=cart.filter(c=>c.id!==id);save();renderCart();updateCart()}
function removeCart(id){cart=cart.filter(c=>c.id!==id);save();renderCart();updateCart()}
function checkout(){open(`<button class="close" onclick="closeM()">×</button><h2>Checkout</h2><div class="field"><label>Name</label><input id="cname" placeholder="Your name"></div><div class="field"><label>Phone</label><input id="cphone" placeholder="080..."></div><div class="field"><label>Delivery / Pickup</label><select id="cmode"><option>Pickup</option><option>Delivery</option></select></div><div class="field"><label>Location / Address</label><input id="caddr" placeholder="Eziobodo lodge / pickup point"></div><div class="field"><label>Payment</label><select id="cpay"><option>Pay on delivery / pickup</option><option>Online payment (coming soon)</option></select></div><button class="btn full" onclick="placeOrder()">Place order</button>`)}
function placeOrder(){let name=document.getElementById("cname").value.trim(),phone=document.getElementById("cphone").value.trim(),addr=document.getElementById("caddr").value.trim();if(!name||!phone||!addr){toast("Please fill in your details");return}let total=cart.reduce((a,x)=>a+products.find(p=>p.id===x.id).price*x.qty,0);orders.unshift({id:"FP"+Date.now().toString().slice(-7),date:new Date().toLocaleString(),name,phone,addr,total,status:"Pending",items:cart.map(x=>({...x,name:products.find(p=>p.id===x.id).name}))});cart=[];save();closeM();toast("Order placed successfully!");go("orders")}
function renderOrders(){document.getElementById("main").innerHTML=`<div class="title">My orders</div><div class="list section">${orders.length?orders.map(o=>`<div class="order"><div class="row"><b>#${o.id}</b><span class="pill">${o.status}</span></div><div class="small">${o.date}</div><p>${o.items.map(i=>`${i.name} ×${i.qty}`).join(", ")}</p><div class="price">${naira(o.total)}</div><div class="small">📍 ${o.addr}</div></div>`).join(""):`<div class="empty">No orders yet.</div>`}</div>`}
function renderProfile(){
 const status = SUPABASE_READY ? 'Configured' : 'Needs key';
 const statusText = SUPABASE_READY ? 'Supabase client is configured. Your next step is to replace the demo localStorage flow with live database/auth.' : 'Paste your full Supabase publishable key in the code block near the top of this file, then upload it to GitHub.';
 document.getElementById("main").innerHTML=`<div class="admin"><div style="font-size:22px;font-weight:900">FUTOPlug</div><p>Student marketplace</p><div class="stats"><div class="stat"><b>${products.length}</b>Demo Products</div><div class="stat"><b>${orders.length}</b>Demo Orders</div><div class="stat"><b>₦0</b>Commission</div><div class="stat"><b>${status}</b>Supabase</div></div></div><div class="section list"><button class="btn full" onclick="testSupabase()">🔌 Test Supabase connection</button><button class="btn alt full" onclick="openSeller()">🏪 Become a seller</button><button class="btn alt full" onclick="openAdmin()">⚙️ Demo admin dashboard</button><button class="btn alt full" onclick="toast('Payment integration comes next')">💳 Payment settings</button></div><div class="card"><b>Supabase setup</b><p class="small">${statusText}</p><p class="small"><b>Important:</b> use only a publishable key (sb_publishable_...) or legacy anon key (eyJ...). Never put an sb_secret_... or service_role key in this file.</p></div>`
}
async function testSupabase(){
 if(!SUPABASE_READY || !supabaseClient){toast('Paste your full publishable/anon key first');return}
 const {error}=await supabaseClient.from('products').select('id').limit(1);
 if(error){toast('Supabase connected, but database access needs checking'); console.error(error);}
 else toast('Supabase connection works!');
}
function openSeller(){open(`<button class="close" onclick="closeM()">×</button><h2>Become a Seller</h2><p class="small">Demo seller onboarding.</p><div class="field"><label>Store name</label><input id="sname" placeholder="e.g. Evans Tech"></div><div class="field"><label>Phone</label><input id="sphone" placeholder="080..."></div><div class="field"><label>Location</label><input id="sloc" value="Eziobodo"></div><button class="btn full" onclick="toast('Seller application saved for admin review');closeM()">Submit for approval</button>`)}
function openAdmin(){open(`<button class="close" onclick="closeM()">×</button><h2>Admin dashboard</h2><div class="stats"><div class="stat" style="background:#eef7f5"><b>${products.length}</b>Products</div><div class="stat" style="background:#eef7f5"><b>${orders.length}</b>Orders</div><div class="stat" style="background:#eef7f5"><b>4</b>Demo sellers</div><div class="stat" style="background:#eef7f5"><b>5%</b>Commission</div></div><h3>Recent orders</h3>${orders.slice(0,5).map(o=>`<div class="order"><b>#${o.id}</b> — ${naira(o.total)}<br><span class="small">${o.status}</span></div>`).join("")||'<p class="small">No orders yet.</p>'}`)}
function open(content){document.getElementById("sheet").innerHTML=content;document.getElementById("modal").classList.add("open")}
function closeM(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeM()});
go("home");
</script>
</body>
</html>
